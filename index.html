<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M_Lily | لوحة تحليلات وإدارة بيانات Excel المتقدمة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #2e7d32;
            --primary-soft: #e8f5e9;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 20px 15px; direction: rtl; }
        .container { max-width: 1300px; margin: auto; }

        /* Card Styles */
        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .brand h1 { font-size: 1.5rem; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .brand span { font-size: 0.85rem; color: var(--text-muted); }

        .status { padding: 6px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .status-loading { background: #fef3c7; color: #92400e; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }

        /* KPI Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .stat-info h3 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-info p { font-size: 1.3rem; font-weight: 800; color: var(--text-main); }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .tab-btn { padding: 10px 22px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 700; color: var(--text-muted); transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .tab-btn:hover { background: #f1f5f9; color: var(--text-main); }
        .tab-btn.active { background: var(--primary-soft); color: var(--primary); }

        /* Controls */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        input[type="text"], select { padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; transition: 0.2s; }
        input[type="text"]:focus, select:focus { border-color: var(--primary); ring: 2px solid var(--primary-soft); }

        .btn { padding: 9px 16px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn:hover { background: var(--primary-light); }
        .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); }
        .btn-outline:hover { background: var(--primary-soft); }
        .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #e2e8f0; }

        /* Table */
        .table-wrap { overflow-x: auto; max-height: 550px; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.9rem; white-space: nowrap; }
        th { background: #f8fafc; font-weight: 700; color: #334155; position: sticky; top: 0; z-index: 10; cursor: pointer; user-select: none; }
        th:hover { background: #f1f5f9; }
        tr:hover td { background: #f8fafc; }

        /* Pagination & Footer */
        .table-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .pagination { display: flex; align-items: center; gap: 6px; }
        .page-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 6px; background: white; cursor: pointer; font-size: 0.85rem; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Dropdown columns menu */
        .dropdown { position: relative; }
        .dropdown-menu { display: none; position: absolute; top: 115%; right: 0; background: white; border: 1px solid var(--border); padding: 12px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 260px; overflow-y: auto; z-index: 50; min-width: 210px; }
        .dropdown-menu.show { display: block; }
        .dropdown-menu label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.85rem; cursor: pointer; }

        /* Tab Content */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .chart-box { position: relative; width: 100%; min-height: 420px; }

        @media (max-width: 768px) {
            .controls-bar { flex-direction: column; align-items: stretch; }
            .controls-left, .controls-right { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card header">
        <div class="brand">
            <h1><i class="fa-solid fa-chart-pie"></i> لوحة بيانات وتحليلات Excel</h1>
            <span>M_Lily للحلول والخدمات البرمجية المتكاملة</span>
        </div>
        <div id="statusBadge" class="status status-loading">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري الاتصال بالبيانات...
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-database"></i></div>
            <div class="stat-info">
                <h3>إجمالي السجلات</h3>
                <p id="kpiRows">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-table-columns"></i></div>
            <div class="stat-info">
                <h3>عدد الأعمدة</h3>
                <p id="kpiCols">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-calculator"></i></div>
            <div class="stat-info">
                <h3 id="kpiSumLabel">إجمالي القيمة</h3>
                <p id="kpiSum">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div>
            <div class="stat-info">
                <h3 id="kpiAvgLabel">المتوسط الحسابي</h3>
                <p id="kpiAvg">0</p>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tableTab', this)">
            <i class="fa-solid fa-table-list"></i> جدول البيانات المتقدم
        </button>
        <button class="tab-btn" onclick="switchTab('chartsTab', this)">
            <i class="fa-solid fa-chart-column"></i> التحليلات والرسوم البيانية
        </button>
    </div>

    <div class="card controls-bar">
        <div class="controls-left">
            <input type="text" id="searchBox" placeholder="🔍 بحث في كامل الجدول..." oninput="handleSearch()">
            
            <div class="dropdown">
                <button class="btn btn-secondary" onclick="toggleColMenu(event)">
                    <i class="fa-solid fa-eye"></i> تخصيص الأعمدة
                </button>
                <div id="colMenu" class="dropdown-menu"></div>
            </div>

            <select id="sheetSelector" style="display: none;" onchange="switchSheet()"></select>
        </div>

        <div class="controls-right">
            <button class="btn btn-outline" onclick="exportFilteredExcel()" title="تصدير النتائج كملف Excel">
                <i class="fa-solid fa-file-excel"></i> تصدير Excel
            </button>
            <button class="btn btn-outline" onclick="window.print()" title="طباعة">
                <i class="fa-solid fa-print"></i>
            </button>
            <button class="btn btn-secondary" onclick="loadExcelData()" title="تحديث البيانات">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            
            <input type="file" id="localFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleLocalFile(event)">
            <button class="btn" onclick="document.getElementById('localFileInput').click()">
                <i class="fa-solid fa-folder-open"></i> ملف محلي
            </button>
        </div>
    </div>

    <div id="tableTab" class="card tab-content active">
        <div class="table-wrap" id="tableContainer">
            <p style="text-align: center; padding: 30px; color: var(--text-muted);">جاري تجهيز الجدول...</p>
        </div>
        
        <div class="table-footer">
            <div style="font-size: 0.85rem; color: var(--text-muted);">
                عرض <span id="showingCount">0</span> من إجمالي <span id="totalFilterCount">0</span> صف
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 0.85rem; color: var(--text-muted);">الصفوف بالصفحة:
                    <select id="pageSizeSelect" onchange="changePageSize(this.value)" style="padding: 4px 8px;">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </label>
                <div class="pagination" id="paginationControls"></div>
            </div>
        </div>
    </div>

    <div id="chartsTab" class="card tab-content">
        <div class="controls-bar" style="margin-bottom: 20px; background: #f8fafc; padding: 12px; border-radius: 8px;">
            <div class="controls-left">
                <label>محور التصنيف (X): <select id="chartXCol" onchange="renderChart()"></select></label>
                <label>محور القيم (Y): <select id="chartYCol" onchange="renderChart()"></select></label>
                <label>نوع التجميع: 
                    <select id="aggType" onchange="renderChart()">
                        <option value="sum">مجموع القيم (Sum)</option>
                        <option value="avg">متوسط القيم (Average)</option>
                        <option value="count">عدد التكرار (Count)</option>
                    </select>
                </label>
            </div>
            <div class="controls-right">
                <label>نوع الرسم: 
                    <select id="chartType" onchange="renderChart()">
                        <option value="bar">أعمدة (Bar)</option>
                        <option value="line">خطي (Line)</option>
                        <option value="pie">دائري (Pie)</option>
                        <option value="doughnut">حلقي (Doughnut)</option>
                        <option value="polarArea">قطبي (Polar Area)</option>
                    </select>
                </label>
            </div>
        </div>
        <div class="chart-box">
            <canvas id="analyticsChart"></canvas>
        </div>
    </div>
</div>

<script>
    let rawWorkbook = null;
    let fullDataset = [];
    let filteredDataset = [];
    let headers = [];
    let activeHeaders = new Set();
    
    // Pagination & Sorting state
    let currentPage = 1;
    let rowsPerPage = 25;
    let sortColumn = null;
    let sortAsc = true;
    let myChart = null;

    const DATA_URL = './data.xlsx';

    window.addEventListener('DOMContentLoaded', () => {
        loadExcelData();

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#colMenu') && !e.target.closest('.btn-secondary')) {
                document.getElementById('colMenu').classList.remove('show');
            }
        });
    });

    async function loadExcelData() {
        updateBadge('loading', 'جاري جلب data.xlsx...');
        try {
            const res = await fetch(DATA_URL + '?nocache=' + Date.now());
            if (!res.ok) throw new Error('الملف غير متوفر');
            const buff = await res.arrayBuffer();
            processWorkbook(buff);
            updateBadge('success', 'تم تحميل data.xlsx بنجاح');
        } catch (err) {
            updateBadge('error', 'تعذر تحميل data.xlsx تلقائياً');
            document.getElementById('tableContainer').innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; color: #dc2626; margin-bottom: 12px;"></i>
                    <p style="font-weight: 700; color: #991b1b;">لم يتم العثور على data.xlsx في المستودع</p>
                    <p style="color: #64748b; font-size: 0.9rem; margin-top: 6px;">تأكد من رفع الملف باسم <b>data.xlsx</b> أو استخدم زر "ملف محلي" لفتحه مباشرة.</p>
                </div>`;
        }
    }

    function handleLocalFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            processWorkbook(evt.target.result);
            updateBadge('success', `تم فتح: ${file.name}`);
        };
        reader.readAsArrayBuffer(file);
    }

    function processWorkbook(buffer) {
        try {
            rawWorkbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
            setupSheetSelector();
            loadSheetData(rawWorkbook.SheetNames[0]);
        } catch (err) {
            alert('حدث خطأ في معالجة بنية ملف الإكسل.');
        }
    }

    function setupSheetSelector() {
        const sel = document.getElementById('sheetSelector');
        sel.innerHTML = '';
        if (rawWorkbook.SheetNames.length > 1) {
            sel.style.display = 'inline-block';
            rawWorkbook.SheetNames.forEach(sheet => {
                const opt = document.createElement('option');
                opt.value = sheet;
                opt.textContent = `ورقة: ${sheet}`;
                sel.appendChild(opt);
            });
        } else {
            sel.style.display = 'none';
        }
    }

    function switchSheet() {
        const sheetName = document.getElementById('sheetSelector').value;
        loadSheetData(sheetName);
    }

    function loadSheetData(sheetName) {
        const sheet = rawWorkbook.Sheets[sheetName];
        fullDataset = XLSX.utils.sheet_to_json(sheet, { defval: "" });

        if (fullDataset.length === 0) {
            document.getElementById('tableContainer').innerHTML = '<p style="text-align: center; padding: 20px;">الورقة المحددة لا تحتوي على بيانات.</p>';
            return;
        }

        headers = Object.keys(fullDataset[0]);
        activeHeaders = new Set(headers);
        filteredDataset = [...fullDataset];
        currentPage = 1;

        buildColumnMenu();
        populateChartControls();
        calculateKPIs();
        renderTable();
        renderChart();
    }

    function calculateKPIs() {
        document.getElementById('kpiRows').innerText = fullDataset.length.toLocaleString('ar-EG');
        document.getElementById('kpiCols').innerText = headers.length.toLocaleString('ar-EG');

        // البحث عن أول عمود رقمي لحساب المجموع والمتوسط
        const numCol = headers.find(h => fullDataset.some(r => !isNaN(parseFloat(r[h])) && isFinite(r[h]) && r[h] !== ""));
        
        if (numCol) {
            const vals = fullDataset.map(r => parseFloat(r[numCol])).filter(v => !isNaN(v));
            const sum = vals.reduce((a, b) => a + b, 0);
            const avg = vals.length ? (sum / vals.length) : 0;

            document.getElementById('kpiSumLabel').innerText = `إجمالي (${numCol})`;
            document.getElementById('kpiAvgLabel').innerText = `متوسط (${numCol})`;
            document.getElementById('kpiSum').innerText = sum.toLocaleString('ar-EG', { maximumFractionDigits: 2 });
            document.getElementById('kpiAvg').innerText = avg.toLocaleString('ar-EG', { maximumFractionDigits: 2 });
        } else {
            document.getElementById('kpiSum').innerText = "-";
            document.getElementById('kpiAvg').innerText = "-";
        }
    }

    function renderTable() {
        const visibleCols = headers.filter(h => activeHeaders.has(h));
        
        // Sorting logic
        if (sortColumn) {
            filteredDataset.sort((a, b) => {
                let valA = a[sortColumn] !== undefined ? a[sortColumn] : "";
                let valB = b[sortColumn] !== undefined ? b[sortColumn] : "";
                
                let numA = parseFloat(valA);
                let numB = parseFloat(valB);
                if (!isNaN(numA) && !isNaN(numB)) {
                    return sortAsc ? numA - numB : numB - numA;
                }
                return sortAsc ? String(valA).localeCompare(String(valB), 'ar') : String(valB).localeCompare(String(valA), 'ar');
            });
        }

        // Pagination slice
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredDataset.slice(start, end);

        let html = '<table><thead><tr>';
        html += '<th style="width: 45px; text-align: center;">#</th>';
        visibleCols.forEach(col => {
            let sortIcon = '<i class="fa-solid fa-sort" style="opacity: 0.3; margin-right: 4px;"></i>';
            if (sortColumn === col) {
                sortIcon = sortAsc ? '<i class="fa-solid fa-arrow-up-short-wide" style="color: var(--primary); margin-right: 4px;"></i>' : '<i class="fa-solid fa-arrow-down-wide-short" style="color: var(--primary); margin-right: 4px;"></i>';
            }
            html += `<th onclick="sortTable('${col}')">${col} ${sortIcon}</th>`;
        });
        html += '</tr></thead><tbody>';

        if (pageData.length === 0) {
            html += `<tr><td colspan="${visibleCols.length + 1}" style="text-align: center; padding: 20px; color: var(--text-muted);">لا توجد نتائج مطابقة للبحث</td></tr>`;
        } else {
            pageData.forEach((row, idx) => {
                html += '<tr>';
                html += `<td style="text-align: center; color: #94a3b8; font-weight: bold;">${start + idx + 1}</td>`;
                visibleCols.forEach(col => {
                    html += `<td>${row[col] !== undefined ? row[col] : ''}</td>`;
                });
                html += '</tr>';
            });
        }

        html += '</tbody></table>';
        document.getElementById('tableContainer').innerHTML = html;
        
        // Counter labels
        document.getElementById('showingCount').innerText = pageData.length;
        document.getElementById('totalFilterCount').innerText = filteredDataset.length;

        renderPaginationControls();
    }

    function sortTable(col) {
        if (sortColumn === col) {
            sortAsc = !sortAsc;
        } else {
            sortColumn = col;
            sortAsc = true;
        }
        renderTable();
    }

    function handleSearch() {
        const query = document.getElementById('searchBox').value.trim().toLowerCase();
        if (!query) {
            filteredDataset = [...fullDataset];
        } else {
            filteredDataset = fullDataset.filter(row =>
                Object.values(row).some(val => String(val).toLowerCase().includes(query))
            );
        }
        currentPage = 1;
        renderTable();
    }

    function renderPaginationControls() {
        const totalPages = Math.ceil(filteredDataset.length / rowsPerPage) || 1;
        const container = document.getElementById('paginationControls');
        container.innerHTML = '';

        // Previous button
        const prev = document.createElement('button');
        prev.className = 'page-btn';
        prev.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
        prev.disabled = currentPage === 1;
        prev.onclick = () => { currentPage--; renderTable(); };
        container.appendChild(prev);

        // Simple page numbers
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);

        for (let i = startPage; i <= endPage; i++) {
            const btn = document.createElement('button');
            btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { currentPage = i; renderTable(); };
            container.appendChild(btn);
        }

        // Next button
        const next = document.createElement('button');
        next.className = 'page-btn';
        next.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
        next.disabled = currentPage === totalPages;
        next.onclick = () => { currentPage++; renderTable(); };
        container.appendChild(next);
    }

    function changePageSize(size) {
        rowsPerPage = parseInt(size);
        currentPage = 1;
        renderTable();
    }

    function buildColumnMenu() {
        const menu = document.getElementById('colMenu');
        menu.innerHTML = '';
        headers.forEach(h => {
            const label = document.createElement('label');
            label.innerHTML = `<input type="checkbox" ${activeHeaders.has(h) ? 'checked' : ''} onchange="toggleSingleColumn('${h}', this.checked)"> ${h}`;
            menu.appendChild(label);
        });
    }

    function toggleColMenu(e) {
        e.stopPropagation();
        document.getElementById('colMenu').classList.toggle('show');
    }

    function toggleSingleColumn(col, isChecked) {
        if (isChecked) {
            activeHeaders.add(col);
        } else {
            if (activeHeaders.size > 1) {
                activeHeaders.delete(col);
            } else {
                alert('يجب الإبقاء على عمود واحد على الأقل.');
                buildColumnMenu();
                return;
            }
        }
        renderTable();
    }

    function populateChartControls() {
        const xSel = document.getElementById('chartXCol');
        const ySel = document.getElementById('chartYCol');
        xSel.innerHTML = '';
        ySel.innerHTML = '';

        headers.forEach((h, i) => {
            xSel.innerHTML += `<option value="${h}">${h}</option>`;
            ySel.innerHTML += `<option value="${h}">${h}</option>`;
        });

        if (headers.length > 1) ySel.selectedIndex = 1;
    }

    function renderChart() {
        if (!fullDataset || fullDataset.length === 0) return;

        const xCol = document.getElementById('chartXCol').value;
        const yCol = document.getElementById('chartYCol').value;
        const chartType = document.getElementById('chartType').value;
        const agg = document.getElementById('aggType').value;

        // Grouping & Aggregating Data
        const grouped = {};
        fullDataset.forEach(row => {
            const key = String(row[xCol] || 'غير محدد');
            const val = parseFloat(row[yCol]) || 0;

            if (!grouped[key]) grouped[key] = { sum: 0, count: 0 };
            grouped[key].sum += val;
            grouped[key].count += 1;
        });

        const keys = Object.keys(grouped).slice(0, 15); // Top 15 categories
        let dataPoints = [];

        if (agg === 'sum') {
            dataPoints = keys.map(k => grouped[k].sum);
        } else if (agg === 'avg') {
            dataPoints = keys.map(k => Number((grouped[k].sum / grouped[k].count).toFixed(2)));
        } else if (agg === 'count') {
            dataPoints = keys.map(k => grouped[k].count);
        }

        if (myChart) myChart.destroy();

        const ctx = document.getElementById('analyticsChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: chartType,
            data: {
                labels: keys,
                datasets: [{
                    label: `${yCol} (${agg === 'sum' ? 'مجموع' : agg === 'avg' ? 'متوسط' : 'عدد'})`,
                    data: dataPoints,
                    backgroundColor: [
                        '#1b5e20', '#2563eb', '#d97706', '#dc2626', 
                        '#7c3aed', '#0891b2', '#ca8a04', '#059669', '#e11d48'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: ['pie', 'doughnut', 'polarArea'].includes(chartType) ? 'bottom' : 'top',
                        labels: { font: { family: 'Tajawal' } }
                    }
                }
            }
        });
    }

    function exportFilteredExcel() {
        if (filteredDataset.length === 0) {
            alert('لا توجد بيانات لتصديرها.');
            return;
        }
        const ws = XLSX.utils.json_to_sheet(filteredDataset);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "البيانات");
        XLSX.writeFile(wb, `M_Lily_Export_${Date.now()}.xlsx`);
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        if (tabId === 'chartsTab' && myChart) {
            myChart.resize();
        }
    }

    function updateBadge(state, text) {
        const b = document.getElementById('statusBadge');
        b.className = `status status-${state}`;
        let icon = state === 'loading' ? '<i class="fa-solid fa-spinner fa-spin"></i>' : 
                   state === 'success' ? '<i class="fa-solid fa-circle-check"></i>' : 
                   '<i class="fa-solid fa-circle-xmark"></i>';
        b.innerHTML = `${icon} ${text}`;
    }
</script>

</body>
</html>
