<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M_Lily | لوحة تحليلات Excel السريعة</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

    <style>
        :root { --primary: #1b5e20; --primary-soft: #e8f5e9; --bg: #f8fafc; --card-bg: #ffffff; --border: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: #0f172a; padding: 15px; direction: rtl; }
        .container { max-width: 1400px; margin: auto; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1.5px solid var(--border); }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .status { padding: 5px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .status-loading { background: #fef3c7; color: #92400e; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .tabs { display: flex; gap: 10px; margin-bottom: 12px; }
        .tab-btn { padding: 10px 20px; border: 1px solid var(--border); background: #fff; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem; }
        .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        input[type="text"], select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.9rem; font-weight: bold; }
        .btn { padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
        .btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
        .table-wrap { overflow-x: auto; max-height: 500px; border: 1px solid var(--border); border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.95rem; white-space: nowrap; }
        th { background: #f1f5f9; font-weight: 800; position: sticky; top: 0; z-index: 10; cursor: pointer; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .chart-card-full { grid-column: span 2; }
        .chart-box-card { background: #fff; border: 1.5px solid var(--border); border-radius: 8px; padding: 14px; }
        .chart-box-header { font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        .chart-controls { display: flex; gap: 8px; flex-wrap: wrap; background: #f8fafc; padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; font-weight: bold; }
        .chart-box { position: relative; width: 100%; min-height: 340px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #fff; border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
        @media(max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } .chart-card-full { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card header">
        <div>
            <h1 style="color: var(--primary); font-size: 1.4rem;">📊 M_Lily | لوحة تحليلات Excel السريعة</h1>
        </div>
        <div id="statusBadge" class="status status-loading">⏳ جاري الاتصال بالملف...</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tableTab', this)">📋 جدول البيانات</button>
        <button class="tab-btn" onclick="switchTab('chartsTab', this)">📈 الرسوم البيانية والتحليل (5)</button>
    </div>

    <div class="card controls-bar">
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <input type="text" id="searchBox" placeholder="🔍 بحث فوري..." oninput="handleSearch()">
            <select id="sheetSelector" style="display: none;" onchange="switchSheet()"></select>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-outline" onclick="loadExcelData()"><i class="fa-solid fa-rotate-right"></i> تحديث</button>
            <input type="file" id="localFileInput" accept=".xlsx, .xls" style="display: none;" onchange="handleLocalFile(event)">
            <button class="btn" onclick="document.getElementById('localFileInput').click()"><i class="fa-solid fa-folder-open"></i> ملف محلي</button>
        </div>
    </div>

    <div id="tableTab" class="card tab-content active">
        <div class="table-wrap" id="tableContainer">
            <p style="text-align:center; padding: 20px;">جاري تجهيز البيانات...</p>
        </div>
    </div>

    <div id="chartsTab" class="card tab-content">
        <div class="stats-grid">
            <div class="stat-card"><h3>إجمالي القيم</h3><p id="kpiSum" style="font-size: 1.2rem; font-weight: 800; color: var(--primary);">0</p></div>
            <div class="stat-card"><h3>المتوسط</h3><p id="kpiAvg" style="font-size: 1.2rem; font-weight: 800;">0</p></div>
            <div class="stat-card"><h3>أعلى قيمة</h3><p id="kpiMax" style="font-size: 1.2rem; font-weight: 800;">0</p></div>
            <div class="stat-card"><h3>أدنى قيمة</h3><p id="kpiMin" style="font-size: 1.2rem; font-weight: 800;">0</p></div>
            <div class="stat-card"><h3>الفئات</h3><p id="kpiCat" style="font-size: 1.2rem; font-weight: 800;">0</p></div>
        </div>

        <div class="charts-grid">
            <div class="chart-box-card chart-card-full">
                <div class="chart-box-header">1. الرسم البياني الشامل</div>
                <div class="chart-controls">
                    <label>النوع: <select id="c1_type" onchange="renderChart(1)"><option value="bar">أعمدة</option><option value="line">خطي</option><option value="pie">دائري</option><option value="doughnut">حلقي</option></select></label>
                    <label>محور X: <select id="c1_x" onchange="renderChart(1)"></select></label>
                    <label>محور Y: <select id="c1_y" onchange="renderChart(1)"></select></label>
                    <label>الحساب: <select id="c1_agg" onchange="renderChart(1)"><option value="sum">مجموع</option><option value="avg">متوسط</option><option value="count">تكرار</option></select></label>
                </div>
                <div class="chart-box"><canvas id="canvas_1"></canvas></div>
            </div>

            <div class="chart-box-card">
                <div class="chart-box-header">2. مقارنة الأعمدة</div>
                <div class="chart-controls">
                    <label>محور X: <select id="c2_x" onchange="renderChart(2)"></select></label>
                    <label>محور Y: <select id="c2_y" onchange="renderChart(2)"></select></label>
                    <label>الحساب: <select id="c2_agg" onchange="renderChart(2)"><option value="sum">مجموع</option><option value="count">تكرار</option></select></label>
                </div>
                <div class="chart-box"><canvas id="canvas_2"></canvas></div>
            </div>

            <div class="chart-box-card">
                <div class="chart-box-header">3. توزيع النسب (Doughnut)</div>
                <div class="chart-controls">
                    <label>محور X: <select id="c3_x" onchange="renderChart(3)"></select></label>
                    <label>محور Y: <select id="c3_y" onchange="renderChart(3)"></select></label>
                    <label>الحساب: <select id="c3_agg" onchange="renderChart(3)"><option value="sum">مجموع</option><option value="count">تكرار</option></select></label>
                </div>
                <div class="chart-box"><canvas id="canvas_3"></canvas></div>
            </div>

            <div class="chart-box-card">
                <div class="chart-box-header">4. مسار الاتجاه (Line)</div>
                <div class="chart-controls">
                    <label>محور X: <select id="c4_x" onchange="renderChart(4)"></select></label>
                    <label>محور Y: <select id="c4_y" onchange="renderChart(4)"></select></label>
                    <label>الحساب: <select id="c4_agg" onchange="renderChart(4)"><option value="sum">مجموع</option><option value="avg">متوسط</option></select></label>
                </div>
                <div class="chart-box"><canvas id="canvas_4"></canvas></div>
            </div>

            <div class="chart-box-card">
                <div class="chart-box-header">5. التوزيع القطبي (Polar)</div>
                <div class="chart-controls">
                    <label>محور X: <select id="c5_x" onchange="renderChart(5)"></select></label>
                    <label>محور Y: <select id="c5_y" onchange="renderChart(5)"></select></label>
                    <label>الحساب: <select id="c5_agg" onchange="renderChart(5)"><option value="sum">مجموع</option><option value="count">تكرار</option></select></label>
                </div>
                <div class="chart-box"><canvas id="canvas_5"></canvas></div>
            </div>
        </div>
    </div>
</div>

<script>
    Chart.register(ChartDataLabels);
    let rawWorkbook = null, fullDataset = [], filteredDataset = [], headers = [];
    const chartInstances = {};
    const COLORS = ['#1b5e20', '#2563eb', '#d97706', '#dc2626', '#7c3aed', '#0891b2', '#ca8a04', '#059669'];

    window.addEventListener('DOMContentLoaded', () => loadExcelData());

    async function loadExcelData() {
        const badge = document.getElementById('statusBadge');
        badge.className = 'status status-loading';
        badge.innerText = '⏳ جاري التحميل...';
        try {
            const res = await fetch('./data.xlsx?v=' + Date.now());
            if (!res.ok) throw new Error();
            const buff = await res.arrayBuffer();
            processWorkbook(buff);
            badge.className = 'status status-success';
            badge.innerText = '✅ جاهز وسريع';
        } catch {
            badge.className = 'status status-error';
            badge.innerText = '⚠️ تعذر تحميل data.xlsx';
        }
    }

    function handleLocalFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => processWorkbook(evt.target.result);
        reader.readAsArrayBuffer(file);
    }

    function processWorkbook(buffer) {
        rawWorkbook = XLSX.read(new Uint8Array(buffer), { type: 'array' });
        const sheet = rawWorkbook.Sheets[rawWorkbook.SheetNames[0]];
        fullDataset = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (fullDataset.length === 0) return;
        headers = Object.keys(fullDataset[0]);
        filteredDataset = fullDataset;
        populateSelectors();
        renderTable();
    }

    function renderTable() {
        let html = '<table><thead><tr>';
        headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead><tbody>';
        filteredDataset.slice(0, 50).forEach(row => {
            html += '<tr>';
            headers.forEach(h => html += `<td>${row[h] !== undefined ? row[h] : ''}</td>`);
            html += '</tr>';
        });
        html += '</tbody></table>';
        document.getElementById('tableContainer').innerHTML = html;
    }

    function handleSearch() {
        const q = document.getElementById('searchBox').value.toLowerCase();
        filteredDataset = fullDataset.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
        renderTable();
    }

    function populateSelectors() {
        for (let i = 1; i <= 5; i++) {
            const x = document.getElementById(`c${i}_x`), y = document.getElementById(`c${i}_y`);
            x.innerHTML = ''; y.innerHTML = '';
            headers.forEach(h => { x.innerHTML += `<option value="${h}">${h}</option>`; y.innerHTML += `<option value="${h}">${h}</option>`; });
            if (headers.length > 1) { x.selectedIndex = 0; y.selectedIndex = Math.min(i, headers.length - 1); }
        }
    }

    function renderChart(n) {
        if (!fullDataset.length) return;
        const xCol = document.getElementById(`c${n}_x`).value;
        const yCol = document.getElementById(`c${n}_y`).value;
        const agg = document.getElementById(`c${n}_agg`).value;
        let type = n === 1 ? document.getElementById('c1_type').value : (n === 2 ? 'bar' : (n === 3 ? 'doughnut' : (n === 4 ? 'line' : 'polarArea')));

        const grouped = {}, numVals = [];
        fullDataset.forEach(row => {
            const k = String(row[xCol] || 'غير محدد');
            const v = parseFloat(row[yCol]) || 0;
            numVals.push(v);
            if (!grouped[k]) grouped[k] = { sum: 0, count: 0 };
            grouped[k].sum += v; grouped[k].count += 1;
        });

        const keys = Object.keys(grouped).slice(0, 10);
        const dataVals = keys.map(k => agg === 'sum' ? grouped[k].sum : (agg === 'avg' ? Number((grouped[k].sum / grouped[k].count
